openapi: 3.1.0
info:
  title: Alloy MCP API
  version: 0.1.0
  description: |
    OpenAPI specification for an Alloy API intended to be exposed by an MCP server.
    It supports executing Alloy commands (`run` and `check`) and retrieving solved instances.
servers:
  - url: https://api.example.com
    description: Example server

tags:
  - name: Executions
    description: Execute Alloy models and inspect execution results
  - name: Instances
    description: Retrieve instances from solved commands

paths:
  /v1/executions:
    post:
      tags: [Executions]
      operationId: createExecution
      summary: Execute Alloy model commands
      description: |
        Parses and executes one or more commands from a model.
        Use `commandSelector` to target specific commands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
      responses:
        '201':
          description: Execution created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionCreatedResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/executions/{executionId}:
    get:
      tags: [Executions]
      operationId: getExecution
      summary: Get execution summary and command results
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '404':
          description: Execution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/executions/{executionId}/commands/{commandName}/solutions/{solutionIndex}/instances:
    get:
      tags: [Instances]
      operationId: listInstances
      summary: List instances for a solved command solution
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
        - $ref: '#/components/parameters/CommandName'
        - $ref: '#/components/parameters/SolutionIndex'
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Zero-based starting index
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Max number of instances to return
      responses:
        '200':
          description: Paginated instance list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceListResponse'
        '404':
          description: Execution, command, or solution not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    ExecutionId:
      in: path
      name: executionId
      required: true
      schema:
        type: string
      description: Server-generated execution identifier
    CommandName:
      in: path
      name: commandName
      required: true
      schema:
        type: string
      description: Name/label of the Alloy command
    SolutionIndex:
      in: path
      name: solutionIndex
      required: true
      schema:
        type: integer
        minimum: 0
      description: Zero-based index of the solution for the command

  schemas:
    ExecutionRequest:
      type: object
      required: [model]
      properties:
        model:
          type: object
          required: [source]
          properties:
            source:
              type: string
              description: Full Alloy model source text
            path:
              type: string
              description: Optional model path/name for diagnostics
        commandSelector:
          type: string
          description: |
            Command selector. If omitted, execute all commands.
            Supports command label or index as string.
        repeat:
          type: integer
          minimum: 0
          default: 1
          description: Number of solutions to collect per command; 0 means continue until no further satisfying instance exists
        options:
          $ref: '#/components/schemas/SolverOptions'

    SolverOptions:
      type: object
      properties:
        solver:
          type: string
          default: sat4j
        noOverflow:
          type: boolean
          default: false
        symmetry:
          type: integer
          minimum: 0
          default: 20
          description: Non-negative symmetry-breaking effort level passed to Alloy (0 disables symmetry breaking)
        unrolls:
          type: integer
          default: -1
        skolemDepth:
          type: integer
          default: 0
          description: Skolemization depth used by Alloy when materializing skolem relations in results
        coreGranularity:
          type: integer
          description: Unsat-core granularity option forwarded to the Alloy solver
        coreMinimization:
          type: integer
          description: Unsat-core minimization strategy value forwarded to the Alloy solver
        inferPartialInstance:
          type: boolean
          default: false
        decomposeMode:
          type: integer
          description: Mirrors Alloy option `decompose_mode`

    ExecutionCreatedResponse:
      type: object
      required: [executionId, status]
      properties:
        executionId:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        result:
          $ref: '#/components/schemas/ExecutionResult'
          description: Present when execution has completed synchronously

    ExecutionResult:
      type: object
      required: [executionId, timestamp, commands]
      properties:
        executionId:
          type: string
        solver:
          type: string
        timestamp:
          type: integer
          format: int64
          description: Execution creation time as Unix epoch milliseconds
        noOverflow:
          type: boolean
        symmetry:
          type: integer
        unrolls:
          type: integer
        coreGranularity:
          type: integer
        coreMinimization:
          type: integer
        inferPartialInstance:
          type: boolean
        decomposeMode:
          type: integer
        skolemDepth:
          type: integer
        repeat:
          type: integer
        commands:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CommandResult'
        sigs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SigDef'

    CommandResult:
      type: object
      required: [type, name, solution]
      properties:
        type:
          type: string
          enum: [check, run]
        name:
          type: string
        source:
          type: string
        scope:
          type: string
        scopes:
          type: array
          items:
            type: string
        expects:
          type: integer
          enum: [0, 1]
          description: Expected satisfiability for the command (0 expects UNSAT, 1 expects SAT)
        maxseq:
          type: integer
        maxprefix:
          type: integer
        minprefix:
          type: integer
        overall:
          type: integer
        transformPath:
          type: string
          nullable: true
        solver:
          type: string
        command:
          type: string
        module:
          $ref: '#/components/schemas/ModuleRef'
        root:
          $ref: '#/components/schemas/ModuleRef'
        bitwidth:
          type: integer
        unrolls:
          type: integer
        overflow:
          type: boolean
        skolemDepth:
          type: integer
        solution:
          type: array
          items:
            $ref: '#/components/schemas/Solution'

    Solution:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/Instance'
        loopstate:
          type: integer
          default: -1
          description: Index of the loop-back state in a temporal trace; -1 means no loop-back state exists
        utctime:
          type: integer
          format: int64
          description: Solution generation time as Unix epoch milliseconds
        incremental:
          type: boolean
        sigs:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SigDef'
        duration:
          type: integer
          format: int64
          description: Solve duration in milliseconds
        localtime:
          type: string
        timezone:
          type: string

    Instance:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                type: array
                items:
                  type: string
        skolems:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Tuples'
        state:
          type: integer
          description: Trace state index of this instance in temporal solutions; -1 means the instance is non-temporal
        messages:
          type: array
          items:
            type: string

    Tuples:
      type: object
      properties:
        arity:
          type: integer
        data:
          type: array
          items:
            type: array
            items:
              type: string

    SigDef:
      type: object
      properties:
        name:
          type: string
        cardinality:
          type: string
          enum: [none, lone, one, some, set]
        isEnum:
          type: boolean
        meta:
          type: boolean
        builtin:
          type: boolean
        type:
          type: string
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldDef'

    FieldDef:
      type: object
      properties:
        name:
          type: string
        meta:
          type: boolean
        var:
          type: boolean
        type:
          type: string
        arity:
          type: integer

    ModuleRef:
      type: object
      properties:
        name:
          type: string
          nullable: true
        path:
          type: string
        opens:
          type: array
          items:
            $ref: '#/components/schemas/OpenRef'

    OpenRef:
      type: object
      properties:
        module:
          $ref: '#/components/schemas/ModuleRef'
        parameters:
          type: array
          items:
            type: string

    InstanceListResponse:
      type: object
      required: [executionId, commandName, solutionIndex, total, offset, limit, items]
      properties:
        executionId:
          type: string
        commandName:
          type: string
        solutionIndex:
          type: integer
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Instance'

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
